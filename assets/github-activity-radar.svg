<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" fill="none">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .green-glow { filter: drop-shadow(0 0 6px rgba(34, 197, 94, 0.6)); }
      .box-glow { filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.45)); }
    </style>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="880" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="bar-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="poly-grad" x1="50" y1="130" x2="150" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Outer Container Card -->
  <rect x="1" y="1" width="878" height="478" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" class="box-glow" />

  <!-- Top Badge Row -->
  <g transform="translate(28, 24)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.38" stroke-width="1" />
    <circle cx="14" cy="14" r="4.5" fill="#22c55e" class="green-glow" />
    <text x="26" y="18" fill="#4ade80" font-size="11.5" font-weight="600" letter-spacing="0.05em" class="font-sans">TOP 1% WORLDWIDE GITHUB CONTRIBUTOR</text>

    <!-- Right Profile Link Pill -->
    <g transform="translate(680, 0)">
      <rect x="0" y="0" width="144" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="14" y="18" fill="#c9d1d9" font-size="11.5" font-weight="500" class="font-sans">@29rdx on GitHub ↗</text>
    </g>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(28, 68)">
    <text x="0" y="24" fill="#f0f6fc" font-size="20" font-weight="700" letter-spacing="-0.02em" class="font-sans">Verified Contributor Intelligence &amp; Activity Radar</text>
    <text x="0" y="44" fill="#8b949e" font-size="12.5" font-weight="400" class="font-sans">Direct systems engineering, low-latency architectures, and high-frequency production code deployment verified on GitHub.</text>
  </g>

  <!-- Main Content Grid -->
  <g transform="translate(28, 128)">

    <!-- Left Box: Activity Radar Diagram -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="360" height="318" rx="12" fill="#0d1117" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1.2" />
      
      <!-- Axis Lines -->
      <!-- Vertical Axis -->
      <line x1="180" y1="46" x2="180" y2="216" stroke="#22c55e" stroke-width="1.8" opacity="0.85" />
      <!-- Horizontal Axis -->
      <line x1="58" y1="131" x2="302" y2="131" stroke="#22c55e" stroke-width="1.8" opacity="0.85" />

      <!-- Center Cross Tick -->
      <circle cx="180" cy="131" r="2.5" fill="#22c55e" />

      <!-- Radar Polygon: Commits 87% left, Code Review 4% top, Pull Requests 9% bottom, Issues 0% right -->
      <!-- Center is (180, 131). Commits = 180 - (122 * 0.87) = 74. Review = 131 - (85 * 0.04) = 127. PR = 131 + (85 * 0.09) = 139 -->
      <polygon points="74,131 180,127 180,131 180,139" fill="url(#poly-grad)" stroke="#22c55e" stroke-width="2" stroke-linejoin="round" class="green-glow" />

      <!-- Vertices Points with White Center & Green Ring -->
      <!-- Commits Vertex (87%) -->
      <circle cx="74" cy="131" r="4.5" fill="#ffffff" stroke="#22c55e" stroke-width="2" class="green-glow" />
      <!-- Code Review Vertex (4%) -->
      <circle cx="180" cy="127" r="3.5" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" class="green-glow" />
      <!-- PR Vertex (9%) -->
      <circle cx="180" cy="139" r="3.5" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" class="green-glow" />

      <!-- Radar Axis Labels -->
      <!-- Top: 4% Code review -->
      <text x="180" y="24" fill="#e6edf3" font-size="12.5" font-weight="600" text-anchor="middle" class="font-sans">4%</text>
      <text x="180" y="38" fill="#8b949e" font-size="11" text-anchor="middle" class="font-sans">Code review</text>

      <!-- Bottom: 9% Pull requests -->
      <text x="180" y="235" fill="#e6edf3" font-size="12.5" font-weight="600" text-anchor="middle" class="font-sans">9%</text>
      <text x="180" y="249" fill="#8b949e" font-size="11" text-anchor="middle" class="font-sans">Pull requests</text>

      <!-- Left: 87% Commits -->
      <text x="44" y="126" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="end" class="font-sans">87%</text>
      <text x="44" y="141" fill="#8b949e" font-size="11" text-anchor="end" class="font-sans">Commits</text>

      <!-- Right: Issues -->
      <text x="314" y="135" fill="#8b949e" font-size="11.5" text-anchor="start" class="font-sans">Issues</text>

      <!-- Divider line -->
      <line x1="20" y1="264" x2="340" y2="264" stroke="#21262d" stroke-width="1" />

      <!-- Subtext inside radar card -->
      <text x="180" y="283" fill="#8b949e" font-size="10.5" text-anchor="middle" class="font-sans">Official 4-Axis GitHub Activity Radar</text>
      <text x="180" y="300" fill="#4ade80" font-size="10" font-weight="600" text-anchor="middle" class="font-sans">87% Direct Code Velocity places this profile in top 1%</text>
    </g>

    <!-- Right Box: Metrics & Core Repositories -->
    <g transform="translate(382, 0)">

      <!-- Metric 1: Commits -->
      <g transform="translate(0, 0)">
        <text x="0" y="13" fill="#e6edf3" font-size="13" font-weight="600" class="font-sans">Direct Code Commits</text>
        <text x="440" y="13" fill="#4ade80" font-size="13" font-weight="700" text-anchor="end" class="font-sans">87%</text>
        <rect x="0" y="20" width="440" height="7" rx="3.5" fill="#21262d" />
        <rect x="0" y="20" width="383" height="7" rx="3.5" fill="url(#bar-grad)" class="green-glow" />
        <text x="0" y="41" fill="#8b949e" font-size="10.5" class="font-sans">Zero-copy network parsers, streaming telemetry engines &amp; C++20 core</text>
      </g>

      <!-- Metric 2: Pull Requests -->
      <g transform="translate(0, 52)">
        <text x="0" y="13" fill="#e6edf3" font-size="13" font-weight="600" class="font-sans">Pull Requests &amp; Architectural Merges</text>
        <text x="440" y="13" fill="#4ade80" font-size="13" font-weight="700" text-anchor="end" class="font-sans">9%</text>
        <rect x="0" y="20" width="440" height="7" rx="3.5" fill="#21262d" />
        <rect x="0" y="20" width="40" height="7" rx="3.5" fill="url(#bar-grad)" />
        <text x="0" y="41" fill="#8b949e" font-size="10.5" class="font-sans">Cross-branch coordination, multispectral satellite data &amp; upstream PRs</text>
      </g>

      <!-- Metric 3: Code Review -->
      <g transform="translate(0, 104)">
        <text x="0" y="13" fill="#e6edf3" font-size="13" font-weight="600" class="font-sans">Code Review &amp; Security Audits</text>
        <text x="440" y="13" fill="#4ade80" font-size="13" font-weight="700" text-anchor="end" class="font-sans">4%</text>
        <rect x="0" y="20" width="440" height="7" rx="3.5" fill="#21262d" />
        <rect x="0" y="20" width="18" height="7" rx="3.5" fill="url(#bar-grad)" />
        <text x="0" y="41" fill="#8b949e" font-size="10.5" class="font-sans">Peer review, concurrency safety, OWASP API audits &amp; cryptographic proofs</text>
      </g>

      <!-- Stats Summary Strip -->
      <g transform="translate(0, 160)">
        <rect x="0" y="0" width="440" height="38" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        
        <g transform="translate(18, 24)">
          <text fill="#4ade80" font-size="13.5" font-weight="700" class="font-sans">2,840+</text>
          <text x="56" y="-1" fill="#8b949e" font-size="11" class="font-sans">Commits</text>
        </g>
        <g transform="translate(138, 24)">
          <text fill="#4ade80" font-size="13.5" font-weight="700" class="font-sans">142 Days</text>
          <text x="64" y="-1" fill="#8b949e" font-size="11" class="font-sans">Streak</text>
        </g>
        <g transform="translate(262, 24)">
          <text fill="#4ade80" font-size="13.5" font-weight="700" class="font-sans">18</text>
          <text x="20" y="-1" fill="#8b949e" font-size="11" class="font-sans">Verified Repos</text>
        </g>
        <g transform="translate(366, 24)">
          <text fill="#4ade80" font-size="13.5" font-weight="700" class="font-sans">Top 1%</text>
        </g>
      </g>

      <!-- Verified Core Systems Repositories Section -->
      <g transform="translate(0, 214)">
        <text x="0" y="11" fill="#8b949e" font-size="10.5" font-weight="600" letter-spacing="0.06em" class="font-sans">VERIFIED CORE SYSTEMS REPOSITORIES</text>

        <!-- Repo 1: sentinel-dpi-engine -->
        <g transform="translate(0, 20)">
          <rect x="0" y="0" width="440" height="23" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
          <text x="10" y="16" fill="#f0f6fc" font-size="11" font-weight="600" class="font-mono">⚡ sentinel-dpi-engine</text>
          <text x="180" y="16" fill="#8b949e" font-size="10" class="font-sans">C++20 Wire-rate DPI parser with TLS SNI</text>
          <rect x="382" y="3.5" width="48" height="16" rx="4" fill="#238636" fill-opacity="0.25" stroke="#2ea44f" stroke-width="0.7" />
          <text x="406" y="15" fill="#3fb950" font-size="9" font-weight="600" text-anchor="middle" class="font-sans">C++20</text>
        </g>

        <!-- Repo 2: distributed-telemetry-engine -->
        <g transform="translate(0, 48)">
          <rect x="0" y="0" width="440" height="23" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
          <text x="10" y="16" fill="#f0f6fc" font-size="11" font-weight="600" class="font-mono">⚡ distributed-telemetry-engine</text>
          <text x="210" y="16" fill="#8b949e" font-size="10" class="font-sans">Go lock-free ring-buffer pipeline</text>
          <rect x="396" y="3.5" width="34" height="16" rx="4" fill="#238636" fill-opacity="0.25" stroke="#2ea44f" stroke-width="0.7" />
          <text x="413" y="15" fill="#3fb950" font-size="9" font-weight="600" text-anchor="middle" class="font-sans">Go</text>
        </g>

        <!-- Repo 3: aegis-mesh-pay -->
        <g transform="translate(0, 76)">
          <rect x="0" y="0" width="440" height="23" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
          <text x="10" y="16" fill="#f0f6fc" font-size="11" font-weight="600" class="font-mono">⚡ aegis-mesh-pay</text>
          <text x="145" y="16" fill="#8b949e" font-size="10" class="font-sans">Offline BLE mesh protocol &amp; Merkle ledger</text>
          <rect x="388" y="3.5" width="42" height="16" rx="4" fill="#238636" fill-opacity="0.25" stroke="#2ea44f" stroke-width="0.7" />
          <text x="409" y="15" fill="#3fb950" font-size="9" font-weight="600" text-anchor="middle" class="font-sans">Java</text>
        </g>
      </g>

    </g>
  </g>
</svg>
